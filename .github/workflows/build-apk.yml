name: Build Android APK and Play Store bundle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish test APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sunrise-bakery.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sunrise-bakery.apk \
            --title "Sunrise Bakery APK (latest)" \
            --notes "Download sunrise-bakery.apk on your Android phone and install it. Built from commit ${GITHUB_SHA::7}."

      - name: Build signed Play Store bundle (.aab)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Publish Play Store bundle on the Releases page
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab sunrise-bakery-play.aab
          gh release delete play-store --yes --cleanup-tag || true
          gh release create play-store sunrise-bakery-play.aab \
            --title "Sunrise Bakery - Google Play upload file (.aab)" \
            --notes "Upload sunrise-bakery-play.aab in Google Play Console. Version code ${{ github.run_number }}."
