name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sunrise-bakery.apk

      - name: Keep APK as a build download
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-bakery-apk
          path: sunrise-bakery.apk

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sunrise-bakery.apk \
            --title "Sunrise Bakery APK (latest)" \
            --notes "Download sunrise-bakery.apk on your Android phone and install it. Built from commit ${GITHUB_SHA::7}."
