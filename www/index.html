<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrise Bakery Manager</title>
<meta name="theme-color" content="#5a3420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ef; --card:#ffffff; --ink:#2b1d14; --ink2:#6b5a4e; --muted:#9a8a7d;
  --line:#eadfd2; --brand:#c8551b; --brand2:#f39a2b; --brand-soft:#fde9d6;
  --choc:#5a3420; --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b7791f; --warn-soft:#fdf1d8;
  --bad:#c0392b; --bad-soft:#fbe4e1; --info:#2a6fb5; --info-soft:#e2eefa;
  --inc:#2a78d6; --exp:#eb6834;
  --r:14px; --shadow:0 1px 2px rgba(60,30,10,.06),0 4px 14px rgba(60,30,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:232px;background:var(--choc);color:#fbe9d8;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo svg{flex-shrink:0}
.logo b{font-family:'Fraunces',serif;font-size:19px;display:block;line-height:1.1}
.logo small{opacity:.7;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;cursor:pointer;text-align:left;width:100%;font-weight:500}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--brand);color:#fff}
.nav svg{width:19px;height:19px;flex-shrink:0}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#aaa;vertical-align:middle}
.dot.online{background:#4ade80}.dot.local{background:#fbbf24}
main{flex:1;min-width:0;padding:24px 28px 100px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:26px;flex:1}
.banner{background:var(--warn-soft);color:#7a5210;border:1px solid #f1d9a6;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#d9c6b3}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#b04812}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.wa:hover{background:#1eb858}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
/* Cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.sec{margin-top:22px}
.sec>h2,.card>h2{font-size:18px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.two{grid-template-columns:1.4fr 1fr}
@media(max-width:980px){.two{grid-template-columns:1fr}}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st-Pending{background:var(--warn-soft);color:#8a5a0c}
.st-Baking{background:var(--info-soft);color:var(--info)}
.st-Ready{background:var(--ok-soft);color:var(--ok)}
.st-Delivered{background:#eee8e1;color:#5d5047}
.st-Cancelled{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .c{opacity:.7;margin-left:4px}
/* Orders */
.olist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.oc{display:flex;flex-direction:column;gap:8px}
.oc .h{display:flex;align-items:flex-start;gap:8px}
.oc .h b{font-size:16px}
.oc .no{font-size:12px;color:var(--muted)}
.oc .meta{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.oc .money{display:flex;gap:14px;font-size:13px;background:#faf5ee;border-radius:9px;padding:8px 10px}
.oc .money b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.oc .acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.late{color:var(--bad);font-weight:600}
.today{color:var(--brand);font-weight:600}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #f3ece3;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.inc{color:var(--ok);font-weight:600}.exp{color:var(--bad);font-weight:600}
.tw{overflow-x:auto}
/* Forms */
.fg{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fg .full{grid-column:1/-1}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.in,select.in,textarea.in{border:1px solid #e1d3c4;border-radius:9px;padding:9px 11px;background:#fff;width:100%;font-weight:400;color:var(--ink)}
.in:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:transparent}
textarea.in{min-height:80px;resize:vertical}
.search{max-width:280px}
.items .it{display:grid;grid-template-columns:1fr 70px 100px 34px;gap:6px;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(43,29,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50}
.md{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.md h2{font-size:21px;margin-bottom:14px}
.md .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:60;font-size:14px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty svg{opacity:.5;margin-bottom:8px}
/* Bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .t span:last-child{font-variant-numeric:tabular-nums;color:var(--ink2)}
.bar .tr{height:10px;background:#f4ece2;border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
/* Trend chart */
.chart{position:relative}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.wa-prev{background:#e7ffdb;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px;border:1px solid #c9eeb6}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#fffdf8;border:1px dashed #d9c6b3;border-radius:10px;padding:16px;white-space:pre-wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
/* Mobile */
.bnav{display:none}
@media(max-width:820px){
  .side{display:none}
  main{padding:16px 14px 100px}
  .top h1{font-size:22px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:4px 0;cursor:pointer}
  .bnav button.on{color:var(--brand);font-weight:700}
  .bnav svg{width:22px;height:22px}
  .olist{grid-template-columns:1fr}
  .mhead{display:flex!important}
}
.mhead{display:none;align-items:center;gap:8px;margin-bottom:12px}
.mhead b{font-family:'Fraunces',serif;font-size:18px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="modal"></div>
<div id="toastWrap"></div>

<script>
/* ============ Icons ============ */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>',
  orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20M7 8v3M12 8v3M17 8v3M7 4h.01M12 4h.01M17 4h.01"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  bill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 2-2 2 2 3-2 3 2V2l-3 2-3-2-2 2-2-2-3 2z"/><path d="M8 9h8M8 13h6"/></svg>',
  cake:'<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20M12 8v3M12 4.5a1 1 0 0 1 0-1.5"/></svg>'
};
const LOGO = '<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#f39a2b"/><path d="M8 25a12 12 0 0 1 24 0z" fill="#fff6e8"/><g stroke="#fff6e8" stroke-width="2" stroke-linecap="round"><path d="M20 7v3M10.5 11l2 2M29.5 11l-2 2M6 18h3M31 18h3"/></g><rect x="7" y="25" width="26" height="2.4" rx="1.2" fill="#5a3420"/></svg>';

/* ============ Constants ============ */
const STATUSES = ['Pending','Baking','Ready','Delivered','Cancelled'];
const STATUS_LABEL = {Pending:'Pending',Baking:'In Kitchen',Ready:'Ready',Delivered:'Delivered',Cancelled:'Cancelled'};
const METHODS = ['Cash','eSewa','Khalti','FonePay QR','Bank Transfer','Card'];
const INC_CATS = ['Order Advance','Order Payment','Counter Sale','Catering','Other Income'];
const EXP_CATS = ['Ingredients (Flour, Sugar, Butter…)','Dairy & Eggs','Cream & Decorations','Packaging & Boxes','Gas / Fuel','Electricity','Water','Rent','Staff Salary','Delivery / Transport','Marketing & Ads','Equipment & Repair','Other Expense'];
const DEFAULT_CONFIG = {
  shopName:'Sunrise Bakery', shopPhone:'', shopAddress:'', currency:'Rs.',
  tplConfirm:'Namaste {name} 🙏\nThank you for ordering from *{shop}*!\n\n🧾 Order No: {order}\n🎂 Items: {items}\n📅 {type}: {when}\n💰 Total: {cur} {total} | Paid: {cur} {paid} | Balance: {cur} {balance}\n\nWe will message you as soon as it is ready.',
  tplReady:'Namaste {name} 🙏\n\nGood news! Your order *{order}* from *{shop}* is READY 🎂✨\n\nItems: {items}\n{balance_line}\n📅 {type}: {when}\n\nThank you for choosing {shop}! 📞 {shopphone}',
  tplThanks:'Thank you {name} for choosing *{shop}*! 😊\nWe hope everyone enjoyed the {items}.\nWe would love your feedback — and see you again soon! 🎂',
  tplReminder:'Namaste {name} 🙏\nGentle reminder from *{shop}*: balance of {cur} {balance} is pending for order {order}. Thank you!',
  tplBirthday:'Namaste {name} 🙏\n\n🎂🎉 *Happy Birthday {name}!* 🎉🎂\nWishing you a day full of joy and sweetness from all of us at *{shop}*.\n\nCelebrating with a special cake? Order from us — remember *{shop}*! 🍰\n📞 {shopphone}',
  tplAnniv:'Namaste {name} 🙏\n\nIt has been a year since you celebrated with *{shop}* ({items}) 🎂\nHave a special occasion coming up? Order your cake with us again — remember *{shop}*! 🍰\n\n📞 {shopphone}\n📍 {address}'
};

/* ============ State ============ */
const S = {
  view:'dashboard', orders:[], txns:[], products:[], customers:[], reminders:[], config:{...DEFAULT_CONFIG},
  mode:'loading', loaded:{orders:false,txns:false,products:false,customers:false,reminders:false,config:false},
  orderTab:'Active', orderSearch:'', txnFilter:'all', txnSearch:'',
  rep:{range:'month', from:'', to:''}, slow:false, readOnly:false
};
let db = null, dl = null;

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = n => (S.config.currency||'Rs.') + ' ' + Math.round(num(n)).toLocaleString('en-IN');
const fmtN = n => Math.round(num(n)).toLocaleString('en-IN');
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const niceDate = s => { if(!s) return '—'; const d = new Date(s+'T00:00:00'); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); };
const niceTime = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); return ((h%12)||12)+':'+pad(m)+(h<12?' AM':' PM'); };
const genOrderNo = () => { const d = new Date(); return 'SB' + String(d.getFullYear()).slice(2) + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + Math.random().toString(36).slice(2,5).toUpperCase(); };

function waNumber(p){
  let d = String(p||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(d.length === 10 && d.startsWith('9')) d = '977' + d;      // Nepal mobile
  if(d.length === 11 && d.startsWith('0')) d = '977' + d.slice(1);
  return d;
}
function waLink(phone, text){ const n = waNumber(phone); return 'https://wa.me/' + n + '?text=' + encodeURIComponent(text); }

function orderTotal(o){ return Math.max(0, (o.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.price),0) - num(o.discount) + num(o.deliveryCharge)); }
function orderPaid(o){ return S.txns.filter(t=>t.orderId===o.id && t.type==='income').reduce((a,t)=>a+num(t.amount),0); }
function orderBalance(o){ return Math.max(0, orderTotal(o) - orderPaid(o)); }
function itemsText(o){ return (o.items||[]).filter(i=>i.name).map(i=>(num(i.qty)>1?i.qty+' × ':'')+i.name).join(', ') || 'your order'; }

function fillTpl(tpl, o){
  const bal = o ? orderBalance(o) : 0;
  const cur = S.config.currency || 'Rs.';
  const when = o ? (niceDate(o.deliveryDate) + (o.deliveryTime ? ', ' + niceTime(o.deliveryTime) : '')) : '';
  const map = {
    name: o?.customer || 'Customer', order: o?.no || '', items: o ? itemsText(o) : '',
    total: fmtN(o?orderTotal(o):0), paid: fmtN(o?orderPaid(o):0), balance: fmtN(bal),
    balance_line: bal > 0 ? ('💰 Remaining amount: ' + cur + ' ' + fmtN(bal)) : '✅ Payment: Fully paid',
    when, type: o?.type || 'Pickup', shop: S.config.shopName || 'Sunrise Bakery',
    shopphone: S.config.shopPhone || '', address: S.config.shopAddress || '', cur
  };
  return String(tpl||'').replace(/\{(\w+)\}/g, (m,k) => k in map ? map[k] : m);
}

function toast(msg){
  const w = $('#toastWrap'); w.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ w.innerHTML=''; }, 2600);
}

/* ============ Storage layer (online db, fallback local) ============ */
const LS_KEY = 'sunrise_bakery_local_v1';
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({orders:S.orders,txns:S.txns,products:S.products,customers:S.customers,reminders:S.reminders,config:S.config})); }catch(e){} }
function lsLoad(){ try{ const j = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(j){ S.orders=j.orders||[]; S.txns=j.txns||[]; S.products=j.products||[]; S.customers=j.customers||[]; S.reminders=j.reminders||[]; S.config={...DEFAULT_CONFIG,...(j.config||{})}; } }catch(e){} }

const COLS = {orders:'orders', txns:'txns', products:'products', customers:'customers', reminders:'reminders'};
async function put(col, obj){
  obj.updatedAt = new Date().toISOString();
  if(S.mode === 'online'){
    try{ await fast(db.collection(COLS[col]).doc(obj.id).set(JSON.parse(JSON.stringify(obj)))); }
    catch(e){ handleWriteErr(e); throw e; }
  } else {
    const arr = S[col]; const i = arr.findIndex(x=>x.id===obj.id);
    if(i>=0) arr[i] = obj; else arr.push(obj);
    lsSave(); render();
  }
}
async function del(col, id){
  if(S.mode === 'online'){
    try{ await fast(db.collection(COLS[col]).doc(id).delete()); } catch(e){ handleWriteErr(e); throw e; }
  } else { S[col] = S[col].filter(x=>x.id!==id); lsSave(); render(); }
}
async function putConfig(cfg){
  S.config = {...S.config, ...cfg};
  if(S.mode === 'online'){
    try{ await fast(db.doc('config/shop').set(JSON.parse(JSON.stringify(S.config)))); } catch(e){ handleWriteErr(e); throw e; }
  } else { lsSave(); }
  render();
}
function handleWriteErr(e){
  const c = e && e.code;
  if(c === 'invalid_argument' || c === 'permission-denied'){ S.readOnly = true; toast('You have view-only access — changes were not saved.'); render(); }
  else if(c === 'quota_exceeded' || c === 'resource-exhausted'){ toast('Storage is full. Take a backup and delete old records.'); }
  else if(c === 'resource_exhausted'){ toast('Too many actions at once — please wait a moment.'); }
  else toast('Could not save — check your internet and try again.');
}

function loadScript(src){ return new Promise((res,rej)=>{ const e=document.createElement('script'); e.src=src; e.onload=res; e.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(e); }); }
function fast(p){ return new Promise((res,rej)=>{ let done=false; const t=setTimeout(()=>{done=true;res();},1500); p.then(()=>{clearTimeout(t); if(!done) res();}, e=>{clearTimeout(t); if(!done) rej(e); else handleWriteErr(e);}); }); }
function loginScreen(auth){
  return new Promise(resolve=>{
    openModal('<h2>🔐 Staff login</h2><p class="hint">Sign in with the email and password created for your bakery.</p><form id="lgForm"><div class="fg"><label class="f full">Email<input class="in" name="email" type="email" required autocomplete="username"></label><label class="f full">Password<input class="in" name="pw" type="password" required autocomplete="current-password"></label></div><p id="lgErr" style="color:var(--bad);font-size:13px;min-height:18px"></p><div class="ft"><button class="btn pri" type="submit">Sign in</button></div></form>');
    $('#lgForm').onsubmit = async ev => { ev.preventDefault(); const fd = new FormData(ev.target);
      try{ await auth.signInWithEmailAndPassword(fd.get('email').trim(), fd.get('pw')); closeModal(); resolve(); }
      catch(e){ $('#lgErr').textContent = (e.code==='auth/network-request-failed') ? 'No internet. Connect once to sign in.' : 'Wrong email or password.'; } };
  });
}
async function getCloud(){
  let cfg = window.FIREBASE_CONFIG;
  try{ const l = JSON.parse(localStorage.getItem('sb_firebase_cfg')||'null'); if(l && l.apiKey) cfg = l; }catch(e){}
  if(!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith('PASTE')) return null;
  const v = '10.12.2', base = 'https://www.gstatic.com/firebasejs/'+v+'/';
  await loadScript(base+'firebase-app-compat.js'); await loadScript(base+'firebase-auth-compat.js'); await loadScript(base+'firebase-firestore-compat.js');
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const user = await new Promise(res=>{ const un = auth.onAuthStateChanged(u=>{ un(); res(u); }); });
  if(!user) await loginScreen(auth);
  const fs = firebase.firestore();
  try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  return fs;
}
async function init(){
  render();
  let ready = false;
  const slowT = setTimeout(()=>{ if(!ready){ S.slow = true; render(); } }, 10000);
  try{ db = await getCloud(); }catch(e){ db = null; S.cloudFail = true; }
  if(!db){
    clearTimeout(slowT); S.mode = 'local'; lsLoad();
    Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); return;
  }
  S.mode = 'online';
  const done = (k, fromCache) => { if(!fromCache) S.loaded[k] = true; if(Object.values(S.loaded).every(Boolean)){ ready = true; S.slow = false; clearTimeout(slowT); } };
  const onErr = e => { ready = true; clearTimeout(slowT); if(e && (e.code==='revoked' || e.code==='permission-denied')){ S.mode='revoked'; } toast('Connection problem: some data may be out of date.'); render(); };
  for(const k of ['orders','txns','products','customers','reminders']){
    db.collection(COLS[k]).onSnapshot(snap => {
      S[k] = snap.docs.filter(d=>d.exists).map(d => ({...d.data(), id:d.id}));
      done(k, snap.metadata.fromCache); render();
    }, onErr);
  }
  db.doc('config/shop').onSnapshot(snap => {
    S.config = {...DEFAULT_CONFIG, ...(snap.exists ? snap.data() : {})};
    done('config', snap.metadata.fromCache); render();
  }, onErr);
}

/* ---------- Dashboard ---------- */
function vDash(){
  const t = today();
  const tx = S.txns;
  const incT = tx.filter(x=>x.type==='income'&&x.date===t).reduce((a,x)=>a+num(x.amount),0);
  const expT = tx.filter(x=>x.type==='expense'&&x.date===t).reduce((a,x)=>a+num(x.amount),0);
  const mStart = t.slice(0,8)+'01';
  const incM = tx.filter(x=>x.type==='income'&&x.date>=mStart&&x.date<=t).reduce((a,x)=>a+num(x.amount),0);
  const expM = tx.filter(x=>x.type==='expense'&&x.date>=mStart&&x.date<=t).reduce((a,x)=>a+num(x.amount),0);
  const active = S.orders.filter(o=>['Pending','Baking','Ready'].includes(o.status));
  const dueToday = active.filter(o=>o.deliveryDate===t);
  const late = active.filter(o=>o.deliveryDate && o.deliveryDate<t);
  const ready = active.filter(o=>o.status==='Ready');
  const pendingDues = S.orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+orderBalance(o),0);
  const upcoming = active.slice().sort((a,b)=>(a.deliveryDate+(a.deliveryTime||'')).localeCompare(b.deliveryDate+(b.deliveryTime||''))).slice(0,8);

  let h = pageTop('Namaste! 👋', '<button class="btn" data-act="quickSale">'+I.money+'Counter sale</button><button class="btn" data-act="newExpense">'+I.money+'Add expense</button><button class="btn pri" data-act="newOrder">'+I.plus+'New order</button>');
  const remDue = dueReminders();
  if(remDue.length) h += '<div class="banner" style="background:#e3f4ea;border-color:#bfe3cd;color:#14653a;cursor:pointer" data-go="reminders">🔔 <b>'+remDue.length+' customer'+(remDue.length>1?'s':'')+' to message today</b> (birthday wishes / order-again reminders). Tap to open.</div>';
  h += '<div class="grid kpis">' +
    kpi("Today's income", fmt(incT), 'Expense today: '+fmt(expT)) +
    kpi('This month profit', fmt(incM-expM), 'Income '+fmt(incM)+' · Expense '+fmt(expM)) +
    kpi('Orders due today', dueToday.length, late.length ? '<span class="late">'+late.length+' overdue</span>' : 'None overdue') +
    kpi('Ready for pickup', ready.length, active.length+' active orders') +
    kpi('Money to collect', fmt(pendingDues), 'Unpaid balances on orders') +
  '</div>';
  h += '<div class="grid two sec">';
  h += '<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Upcoming orders</h2><span class="sp"></span><button class="btn sm" data-go="orders">View all</button></div>';
  if(!upcoming.length) h += emptyBox('No active orders. Tap “New order” to add one.');
  else h += '<div class="tw"><table class="tbl"><thead><tr><th>Customer</th><th>When</th><th>Status</th><th class="num">Balance</th><th></th></tr></thead><tbody>' +
    upcoming.map(o=>{
      const cls = o.deliveryDate<t?'late':o.deliveryDate===t?'today':'';
      return '<tr><td><b>'+esc(o.customer)+'</b><div class="hint">'+esc(itemsText(o))+'</div></td><td class="'+cls+'">'+(o.deliveryDate===t?'Today':niceDate(o.deliveryDate))+' '+niceTime(o.deliveryTime)+'</td><td>'+statusPill(o.status)+'</td><td class="num">'+fmt(orderBalance(o))+'</td><td>'+nextBtn(o,true)+'</td></tr>';
    }).join('') + '</tbody></table></div>';
  h += '</div>';
  h += '<div class="card"><h2>Last 14 days</h2>' + trendChart(addDays(t,-13), t) + '</div>';
  h += '</div>';
  return h;
}

/* ---------- Trend chart (income vs expense bars) ---------- */
let chartData = [];
function trendChart(from, to){
  const days = []; for(let d=from; d<=to; d=addDays(d,1)){ days.push(d); if(days.length>62) break; }
  const byDay = {}; days.forEach(d=>byDay[d]={inc:0,exp:0});
  S.txns.forEach(x=>{ if(byDay[x.date]){ if(x.type==='income') byDay[x.date].inc+=num(x.amount); else byDay[x.date].exp+=num(x.amount); } });
  chartData = days.map(d=>({d, ...byDay[d]}));
  const max = Math.max(1, ...chartData.map(x=>Math.max(x.inc,x.exp)));
  const W = 600, H = 200, pl = 8, pb = 22, pt = 8;
  const n = chartData.length, slot = (W-pl*2)/n, bw = Math.max(2, Math.min(14, slot/2 - 2));
  const y = v => pt + (H-pt-pb) * (1 - v/max);
  let bars = '', labels = '', hits = '';
  const r = Math.min(4, bw/2);
  const barPath = (x,v) => { const top = y(v), base = H-pb; if(base-top < 0.5) return ''; const rr = Math.min(r, base-top); return '<path d="M'+x+','+base+' V'+(top+rr)+' Q'+x+','+top+' '+(x+rr)+','+top+' H'+(x+bw-rr)+' Q'+(x+bw)+','+top+' '+(x+bw)+','+(top+rr)+' V'+base+' Z"'; };
  chartData.forEach((p,i)=>{
    const cx = pl + slot*i + slot/2;
    const a = barPath(cx-bw-1, p.inc); if(a) bars += a+' fill="var(--inc)"/>';
    const b = barPath(cx+1, p.exp); if(b) bars += b+' fill="var(--exp)"/>';
    const step = Math.ceil(n/7);
    if(i%step===0 || i===n-1){ const dd = new Date(p.d+'T00:00:00'); labels += '<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="#9a8a7d">'+dd.getDate()+' '+MON[dd.getMonth()]+'</text>'; }
    hits += '<rect class="hit" data-i="'+i+'" x="'+(pl+slot*i)+'" y="0" width="'+slot+'" height="'+(H-pb)+'" fill="transparent"/>';
  });
  const grid = [0.5,1].map(f=>'<line x1="0" x2="'+W+'" y1="'+y(max*f)+'" y2="'+y(max*f)+'" stroke="#f1e8dd"/><text x="'+(W-2)+'" y="'+(y(max*f)-4)+'" text-anchor="end" font-size="10" fill="#b0a194">'+fmtN(max*f)+'</text>').join('');
  const tInc = chartData.reduce((a,x)=>a+x.inc,0), tExp = chartData.reduce((a,x)=>a+x.exp,0);
  return '<div class="legend"><span><i style="background:var(--inc)"></i>Income '+fmt(tInc)+'</span><span><i style="background:var(--exp)"></i>Expense '+fmt(tExp)+'</span></div>' +
    '<div class="chart" id="chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Daily income and expense">'+grid+'<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#e2d6c8"/>'+bars+labels+hits+'</svg><div class="tip" id="tip" style="display:none"></div></div>';
}
function bindChart(){
  const c = $('#chart'); if(!c) return; const tip = $('#tip');
  c.querySelectorAll('.hit').forEach(r=>{
    const show = ev => {
      const p = chartData[+r.dataset.i]; const box = c.getBoundingClientRect(); const rb = r.getBoundingClientRect();
      tip.innerHTML = '<b>'+niceDate(p.d)+'</b><br>Income: '+fmt(p.inc)+'<br>Expense: '+fmt(p.exp)+'<br>Net: '+fmt(p.inc-p.exp);
      tip.style.display='block'; tip.style.left = (rb.left - box.left + rb.width/2)+'px'; tip.style.top = '6px';
      r.setAttribute('fill','rgba(200,85,27,.07)');
    };
    r.addEventListener('mouseenter', show); r.addEventListener('click', show);
    r.addEventListener('mouseleave', ()=>{ tip.style.display='none'; r.setAttribute('fill','transparent'); });
  });
}

  if(o.status==='Pending') return '<button class="btn'+sm+'" data-act="setStatus" data-id="'+o.id+'" data-s="Baking">Start baking</button>';
  if(o.status==='Baking') return '<button class="btn pri'+sm+'" data-act="setStatus" data-id="'+o.id+'" data-s="Ready">🎂 Mark ready</button>';
  if(o.status==='Ready') return '<button class="btn'+sm+'" data-act="setStatus" data-id="'+o.id+'" data-s="Delivered">Delivered ✓</button>';
  return '';
}
function vOrders(){
  const t = today();
  const q = S.orderSearch.trim().toLowerCase();
  const counts = {Active:0, Today:0}; STATUSES.forEach(s=>counts[s]=0); counts.All = S.orders.length;
  S.orders.forEach(o=>{ counts[o.status]=(counts[o.status]||0)+1; if(['Pending','Baking','Ready'].includes(o.status)){ counts.Active++; if(o.deliveryDate===t) counts.Today++; } });
  let list = S.orders.filter(o=>{
    if(S.orderTab==='Active' && !['Pending','Baking','Ready'].includes(o.status)) return false;
    if(S.orderTab==='Today' && !(o.deliveryDate===t && ['Pending','Baking','Ready'].includes(o.status))) return false;
    if(STATUSES.includes(S.orderTab) && o.status!==S.orderTab) return false;
    if(q && !((o.customer||'')+' '+(o.phone||'')+' '+(o.no||'')+' '+itemsText(o)).toLowerCase().includes(q)) return false;
    return true;
  });
  const done = ['Delivered','Cancelled'].includes(S.orderTab) || S.orderTab==='All';
  list.sort((a,b)=> done ? (b.deliveryDate||'').localeCompare(a.deliveryDate||'') : (a.deliveryDate+(a.deliveryTime||'')).localeCompare(b.deliveryDate+(b.deliveryTime||'')));
  let h = pageTop('Orders', '<input class="in search" id="orderSearch" placeholder="Search name, phone, order no…" value="'+esc(S.orderSearch)+'"><button class="btn pri" data-act="newOrder">'+I.plus+'New order</button>');
  h += '<div class="tabs">' + ['Active','Today','Pending','Baking','Ready','Delivered','Cancelled','All'].map(k=>'<button class="tab'+(S.orderTab===k?' on':'')+'" data-otab="'+k+'">'+(STATUS_LABEL[k]||k)+'<span class="c">'+(counts[k]||0)+'</span></button>').join('') + '</div>';
  if(!list.length) return h + '<div class="card">'+emptyBox(S.orders.length?'No orders match this filter.':'No orders yet. Add your first cake order!')+'</div>';
  h += '<div class="olist">' + list.map(o=>{
    const tot = orderTotal(o), paid = orderPaid(o), bal = Math.max(0,tot-paid);
    const cls = ['Pending','Baking','Ready'].includes(o.status) ? (o.deliveryDate<t?'late':o.deliveryDate===t?'today':'') : '';
    const cake = o.cake||{};
    const cakeLine = [cake.flavor, cake.weight, cake.shape].filter(Boolean).join(' · ');
    return '<div class="card oc"><div class="h"><div style="flex:1"><b>'+esc(o.customer)+'</b><div class="no">'+esc(o.no)+' · '+esc(o.phone||'no phone')+'</div></div>'+statusPill(o.status)+'</div>' +
      '<div class="meta"><div>🎂 '+esc(itemsText(o))+'</div>'+(cakeLine?'<div>'+esc(cakeLine)+'</div>':'')+(cake.message?'<div>✍️ “'+esc(cake.message)+'”</div>':'')+
      '<div class="'+cls+'">📅 '+esc(o.type||'Pickup')+': '+(o.deliveryDate===t?'Today':niceDate(o.deliveryDate))+' '+niceTime(o.deliveryTime)+(cls==='late'?' (overdue)':'')+'</div>'+(o.type==='Delivery'&&o.address?'<div>📍 '+esc(o.address)+'</div>':'')+(o.notes?'<div>📝 '+esc(o.notes)+'</div>':'')+'</div>' +
      '<div class="money"><div>Total<b>'+fmt(tot)+'</b></div><div>Paid<b>'+fmt(paid)+'</b></div><div>Balance<b style="color:'+(bal>0?'var(--bad)':'var(--ok)')+'">'+(bal>0?fmt(bal):'Paid ✓')+'</b></div></div>' +
      '<div class="acts">'+nextBtn(o)+
        (bal>0 && o.status!=='Cancelled' ? '<button class="btn sm" data-act="collect" data-id="'+o.id+'">'+I.money+'Collect</button>' : '')+
        '<button class="btn sm wa" data-act="waMenu" data-id="'+o.id+'">'+I.wa+'WhatsApp</button>'+
        '<button class="btn sm" data-act="bill" data-id="'+o.id+'">'+I.bill+'Bill</button>'+
        '<button class="btn sm ghost" data-act="editOrder" data-id="'+o.id+'" title="Edit">'+I.edit+'</button>'+
      '</div></div>';
  }).join('') + '</div>';

/* ---------- Reports ---------- */
function repRange(){
  const t = today(), r = S.rep.range;
  if(r==='today') return [t,t];
  if(r==='yesterday'){ const y = addDays(t,-1); return [y,y]; }
  if(r==='week') return [addDays(t,-6),t];
  if(r==='month') return [t.slice(0,8)+'01',t];
  if(r==='lastmonth'){ const d = new Date(t+'T00:00:00'); d.setDate(1); d.setMonth(d.getMonth()-1); const s = ymd(d); const e = new Date(d.getFullYear(), d.getMonth()+1, 0); return [s, ymd(e)]; }
  if(r==='year') return [t.slice(0,4)+'-01-01',t];
  return [S.rep.from||t, S.rep.to||t];
}
function barsBlock(obj, color, total){
  const arr = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  if(!arr.length) return '<div class="hint">No data in this period.</div>';
  const max = Math.max(...arr.map(a=>a[1]),1);
  return '<div class="bars">'+arr.map(([k,v])=>'<div class="bar"><div class="t"><span>'+esc(k)+'</span><span>'+fmt(v)+(total?' · '+Math.round(v/total*100)+'%':'')+'</span></div><div class="tr"><div class="fl" style="width:'+(v/max*100)+'%;background:'+color+'"></div></div></div>').join('')+'</div>';
}
function vReports(){
  const [from,to] = repRange();
  const tx = S.txns.filter(x=>x.date>=from && x.date<=to);
  const inc = tx.filter(x=>x.type==='income'), exp = tx.filter(x=>x.type==='expense');
  const ti = inc.reduce((a,x)=>a+num(x.amount),0), te = exp.reduce((a,x)=>a+num(x.amount),0);
  const ords = S.orders.filter(o=>o.deliveryDate>=from && o.deliveryDate<=to);
  const validOrds = ords.filter(o=>o.status!=='Cancelled');
  const orderValue = validOrds.reduce((a,o)=>a+orderTotal(o),0);
  const byCat = {}, byMethod = {}, byExp = {}, byProd = {}, byStatus = {};
  inc.forEach(x=>{ byCat[x.category]=(byCat[x.category]||0)+num(x.amount); byMethod[x.method||'Cash']=(byMethod[x.method||'Cash']||0)+num(x.amount); });
  exp.forEach(x=>{ byExp[x.category]=(byExp[x.category]||0)+num(x.amount); });
  validOrds.forEach(o=>(o.items||[]).forEach(i=>{ if(i.name) byProd[i.name]=(byProd[i.name]||0)+num(i.qty)*num(i.price); }));
  ords.forEach(o=>byStatus[o.status]=(byStatus[o.status]||0)+1);
  const margin = ti ? Math.round((ti-te)/ti*100) : 0;
  const ranges = [['today','Today'],['yesterday','Yesterday'],['week','Last 7 days'],['month','This month'],['lastmonth','Last month'],['year','This year'],['custom','Custom']];
  let h = pageTop('Reports', '<button class="btn" data-act="exportCsv">'+I.backup+'Export CSV</button><button class="btn" data-act="copyReport">Copy summary</button>');

  if(S.rep.range==='custom') h += '<div class="row" style="margin-bottom:14px"><label class="f">From<input type="date" class="in" id="repFrom" value="'+from+'"></label><label class="f">To<input type="date" class="in" id="repTo" value="'+to+'"></label></div>';
  h += '<div class="hint" style="margin-bottom:12px">Period: '+niceDate(from)+' – '+niceDate(to)+'</div>';
  h += '<div class="grid kpis">'+kpi('Income',fmt(ti),inc.length+' entries')+kpi('Expense',fmt(te),exp.length+' entries')+kpi(ti-te>=0?'Profit':'Loss',fmt(ti-te),ti?('Margin '+margin+'%'):'')+kpi('Orders',validOrds.length,'Order value '+fmt(orderValue))+kpi('Avg order',fmt(validOrds.length?orderValue/validOrds.length:0),(byStatus.Cancelled||0)+' cancelled')+'</div>';
  h += '<div class="card sec"><h2>Daily income vs expense</h2>'+trendChart(from, to)+'</div>';
  h += '<div class="grid two sec"><div class="card"><h2>Expenses by category</h2>'+barsBlock(byExp,'var(--exp)',te)+'</div><div class="card"><h2>Income by source</h2>'+barsBlock(byCat,'var(--inc)',ti)+'</div></div>';
  h += '<div class="grid two sec"><div class="card"><h2>Best-selling items (order value)</h2>'+barsBlock(byProd,'var(--inc)',0)+'</div><div class="card"><h2>Payments received by method</h2>'+barsBlock(byMethod,'var(--inc)',ti)+'</div></div>';
  return h;
}

/* ---------- Reminders (birthday + yearly order-again) ---------- */
function addYears(s,k){ const d = new Date(s+'T00:00:00'); d.setFullYear(d.getFullYear()+k); return ymd(d); }
function bdayInYear(md, yr){ let m = md; if(m==='02-29' && new Date(yr,1,29).getMonth()!==1) m='02-28'; return yr+'-'+m; }
function remindersFor(day){
  const out = [], yr = +day.slice(0,4);
  S.customers.forEach(c=>{
    if(!c.birthday || !(c.phone||c.name)) return;
    const md = c.birthday.slice(5);
    [yr, yr+1].forEach(y=>{
      const bd = bdayInYear(md,y), start = addDays(bd,-1);
      if(day>=start && day<=bd) out.push({id:'bd-'+c.id+'-'+y, type:'bday', name:c.name, phone:c.phone, date:bd, start, tplKey:'tplBirthday', obj:{id:'bd-'+c.id, customer:c.name, phone:c.phone, items:[], type:'Pickup'}});
    });
  });
  const latest = {};
  S.orders.forEach(o=>{ if(o.status==='Cancelled' || !o.deliveryDate) return; const k = custKey(o); if(!k) return; if(!latest[k] || o.deliveryDate>latest[k].deliveryDate) latest[k]=o; });
  Object.values(latest).forEach(o=>{
    for(let k=1;k<=10;k++){
      const ann = addYears(o.deliveryDate,k), start = addDays(ann,-1), end = addDays(ann,5);
      if(day>=start && day<=end) out.push({id:'an-'+o.id+'-'+k, type:'anniv', name:o.customer, phone:o.phone, date:ann, start, tplKey:'tplAnniv', obj:o});
    }
  });
  return out;
}
function sentSet(){ return new Set(S.reminders.map(r=>r.id)); }
function dueReminders(){ const ss = sentSet(); return remindersFor(today()).filter(r=>!ss.has(r.id)); }
async function markSent(id){ if(S.reminders.some(r=>r.id===id)) return; try{ await put('reminders', {id, sentAt:new Date().toISOString()}); }catch(e){} }
function vReminders(){
  const day = today(), ss = sentSet();
  const due = dueReminders(), seen = new Set(due.map(r=>r.id)), up = [];
  for(let i=1;i<=14;i++){ remindersFor(addDays(day,i)).forEach(r=>{ if(!ss.has(r.id) && !seen.has(r.id) && r.start>day){ seen.add(r.id); up.push(r); } }); }
  S.remCache = {}; [...due,...up].forEach(r=>S.remCache[r.id]=r);
  const native = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
  let h = pageTop('Reminders');
  if(native) h += '<div class="card" style="margin-bottom:14px"><div class="row"><div style="flex:1"><b>🔔 Daily phone notification</b><div class="hint">At 9:00 AM the phone tells you how many customers to message.</div></div><button class="btn pri" data-act="enableNotif">Turn on</button></div></div>';
  const item = (r, canSend) => {
    const label = r.type==='bday' ? '🎂 Birthday on '+niceDate(r.date) : '🔁 One year since last order · '+niceDate(r.date);
    const sub = r.type==='anniv' ? '<div class="hint">'+esc(itemsText(r.obj))+'</div>' : '';
    return '<div class="card" style="margin-bottom:10px"><div class="row"><div style="flex:1;min-width:180px"><b>'+esc(r.name)+'</b><div class="hint">'+label+(r.phone?' · '+esc(r.phone):' · <span class="late">no phone</span>')+'</div>'+sub+'</div>'+
      (canSend ? (waNumber(r.phone)?'<button class="btn sm wa" data-act="sendRem" data-rid="'+esc(r.id)+'">'+I.wa+'Send message</button>':'')+'<button class="btn sm" data-act="markSent" data-rid="'+esc(r.id)+'">Mark done</button>' : '<span class="pill st-Pending">from '+niceDate(r.start)+'</span>')+'</div></div>';
  };
  h += '<div class="sec" style="margin-top:0"><h2 style="margin-bottom:10px">To message now ('+due.length+')</h2>'+(due.length?due.map(r=>item(r,true)).join(''):'<div class="card">'+emptyBox('Nobody to message today 🎉<br><span class="hint">Reminders appear 1 day before a customer\'s birthday and 1 day before the one-year anniversary of their last order.</span>')+'</div>')+'</div>';
  if(up.length) h += '<div class="sec"><h2 style="margin-bottom:10px">Coming in the next 2 weeks ('+up.length+')</h2>'+up.sort((a,b)=>a.start.localeCompare(b.start)).map(r=>item(r,false)).join('')+'</div>';
  return h;
}
/* phone notification at 9 AM on days that have reminders */
let _schedT = null;
function schedSoon(){ clearTimeout(_schedT); _schedT = setTimeout(scheduleNotifs, 2500); }
function notifPlugin(){ return window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications; }
async function scheduleNotifs(){
  const LN = notifPlugin(); if(!LN || !Object.values(S.loaded).every(Boolean)) return;
  try{
    const perm = await LN.checkPermissions(); if(perm.display!=='granted') return;
    const pend = await LN.getPending();
    if(pend.notifications && pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n=>({id:n.id}))});
    const ss = sentSet(), list = [];
    for(let i=0;i<14;i++){
      const day = addDays(today(), i), items = remindersFor(day).filter(r=>!ss.has(r.id));
      if(!items.length) continue;
      const at = new Date(day+'T09:00:00'); if(at <= new Date()) continue;
      list.push({id:2000+i, title:'🎂 '+(S.config.shopName||'Sunrise Bakery'), body: items.length+' customer'+(items.length>1?'s':'')+' to message today: '+items.slice(0,3).map(r=>r.name).join(', ')+(items.length>3?'…':''), schedule:{at}});
    }
    if(list.length) await LN.schedule({notifications:list});
  }catch(e){}
}

/* ============ Modals ============ */
function openModal(html){ $('#modal').innerHTML = '<div class="ov" data-close="1"><div class="md">'+html+'</div></div>'; }
function closeModal(){ $('#modal').innerHTML = ''; }
function confirmBox(msg, okLabel, onOk){
  openModal('<h2>Are you sure?</h2><p>'+msg+'</p><div class="ft"><button class="btn" data-close="1">Cancel</button><button class="btn pri" id="cfOk">'+okLabel+'</button></div>');
  $('#cfOk').onclick = async ()=>{ closeModal(); await onOk(); };
}

/* ----- Order form ----- */
function orderForm(o){
  const isNew = !o;
  o = o || {id:uid(), no:genOrderNo(), customer:'', phone:'', items:[{name:'',qty:1,price:''}], cake:{}, deliveryDate:today(), deliveryTime:'', type:'Pickup', address:'', discount:0, deliveryCharge:0, status:'Pending', notes:''};
  const c = o.cake||{};
  const prodOpts = S.products.map(p=>'<option value="'+esc(p.name)+'">').join('');
  openModal('<h2>'+(isNew?'New order':'Edit order '+esc(o.no))+'</h2><form id="oForm"><div class="fg">'+
    '<label class="f">Customer name *<input class="in" name="customer" required value="'+esc(o.customer)+'" list="custList"></label>'+
    '<label class="f">Phone (WhatsApp)<input class="in" name="phone" inputmode="tel" value="'+esc(o.phone)+'" placeholder="98XXXXXXXX"></label>'+
    '<label class="f">Customer birthday <span class="hint">(optional — for a birthday wish)</span><input type="date" class="in" name="birthday" value="'+esc(birthdayFor(o))+'"></label>'+
    '<div class="full"><div class="f" style="font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px">Items <span class="hint">(pick from menu or type your own)</span></div><div class="items" id="itemsBox"></div><button type="button" class="btn sm" id="addItem">'+I.plus+'Add item</button></div>'+
    '<label class="f">Cake flavour<input class="in" name="flavor" value="'+esc(c.flavor)+'" placeholder="Black Forest, Red Velvet…"></label>'+
    '<label class="f">Weight / size<input class="in" name="weight" value="'+esc(c.weight)+'" placeholder="1 lb, 2 lb, 1 kg"></label>'+
    '<label class="f">Shape / design<input class="in" name="shape" value="'+esc(c.shape)+'" placeholder="Round, heart, photo cake…"></label>'+
    '<label class="f">Message on cake<input class="in" name="message" value="'+esc(c.message)+'" placeholder="Happy Birthday Aarav"></label>'+
    '<label class="f">Pickup or delivery<select class="in" name="type"><option'+(o.type==='Pickup'?' selected':'')+'>Pickup</option><option'+(o.type==='Delivery'?' selected':'')+'>Delivery</option></select></label>'+
    '<label class="f">Delivery address<input class="in" name="address" value="'+esc(o.address)+'"></label>'+
    '<label class="f">Date *<input type="date" class="in" name="deliveryDate" required value="'+esc(o.deliveryDate)+'"></label>'+
    '<label class="f">Time<input type="time" class="in" name="deliveryTime" value="'+esc(o.deliveryTime)+'"></label>'+
    '<label class="f">Discount<input type="number" min="0" class="in" name="discount" value="'+esc(o.discount||'')+'"></label>'+
    '<label class="f">Delivery charge<input type="number" min="0" class="in" name="deliveryCharge" value="'+esc(o.deliveryCharge||'')+'"></label>'+
    (isNew?'<label class="f">Advance paid now<input type="number" min="0" class="in" name="advance" placeholder="0"></label><label class="f">Advance method<select class="in" name="method">'+METHODS.map(m=>'<option>'+m+'</option>').join('')+'</select></label>':
      '<label class="f">Status<select class="in" name="status">'+STATUSES.map(s=>'<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+STATUS_LABEL[s]+'</option>').join('')+'</select></label><div></div>')+
    '<label class="f full">Notes<textarea class="in" name="notes" rows="2" placeholder="Eggless, less sugar, candles…">'+esc(o.notes)+'</textarea></label>'+
    '<div class="full card" style="background:#faf5ee;box-shadow:none" id="oSum"></div>'+
    '</div><datalist id="prodList">'+prodOpts+'</datalist><datalist id="custList">'+[...new Set(S.orders.map(x=>x.customer).filter(Boolean))].map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>'+
    '<div class="ft">'+(!isNew?'<button type="button" class="btn danger" id="delOrder">'+I.trash+'Delete</button><span class="sp"></span>':'')+'<button type="button" class="btn" data-close="1">Cancel</button><button class="btn pri" type="submit">'+(isNew?'Save order':'Save changes')+'</button></div></form>');
  let items = JSON.parse(JSON.stringify(o.items && o.items.length ? o.items : [{name:'',qty:1,price:''}]));
  const box = $('#itemsBox'), f = $('#oForm');
  const sum = () => {
    const tmp = {...o, items, discount:num(f.discount.value), deliveryCharge:num(f.deliveryCharge.value)};
    const tot = orderTotal(tmp), paid = isNew ? num(f.advance && f.advance.value) : orderPaid(o);
    $('#oSum').innerHTML = '<div class="row"><span>Total: <b>'+fmt(tot)+'</b></span><span class="sp"></span><span>Paid: <b>'+fmt(paid)+'</b></span><span class="sp"></span><span>Balance: <b>'+fmt(Math.max(0,tot-paid))+'</b></span></div>';
  };
  const drawItems = () => {
    box.innerHTML = items.map((it,i)=>'<div class="it"><input class="in" list="prodList" placeholder="Item e.g. Black Forest Cake" data-i="'+i+'" data-k="name" value="'+esc(it.name)+'"><input class="in" type="number" min="0" step="any" placeholder="Qty" data-i="'+i+'" data-k="qty" value="'+esc(it.qty)+'"><input class="in" type="number" min="0" step="any" placeholder="Price" data-i="'+i+'" data-k="price" value="'+esc(it.price)+'"><button type="button" class="btn sm ghost" data-rm="'+i+'">✕</button></div>').join('');
    sum();
  };
  box.addEventListener('input', e=>{
    const el = e.target; if(!el.dataset.k) return; const i = +el.dataset.i;
    items[i][el.dataset.k] = el.value;
    if(el.dataset.k==='name'){ const p = S.products.find(p=>p.name.toLowerCase()===el.value.trim().toLowerCase()); if(p && !num(items[i].price)){ items[i].price = p.price; box.querySelector('[data-i="'+i+'"][data-k="price"]').value = p.price; } }
    sum();
  });
  box.addEventListener('click', e=>{ const r = e.target.closest('[data-rm]'); if(r){ items.splice(+r.dataset.rm,1); if(!items.length) items=[{name:'',qty:1,price:''}]; drawItems(); } });
  $('#addItem').onclick = ()=>{ items.push({name:'',qty:1,price:''}); drawItems(); };
  f.addEventListener('input', sum);
  f.phone.addEventListener('change', ()=>{ if(!f.birthday.value){ const b = birthdayFor({phone:f.phone.value, customer:f.customer.value}); if(b) f.birthday.value = b; } });
  drawItems();
  if(!isNew) $('#delOrder').onclick = ()=> confirmBox('Delete order <b>'+esc(o.no)+'</b> for '+esc(o.customer)+'? Payments recorded for it stay in Income & Expense.', 'Delete order', async ()=>{ try{ await del('orders', o.id); toast('Order deleted'); }catch(e){} });
  f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    const clean = items.filter(i=>String(i.name).trim()).map(i=>({name:String(i.name).trim(), qty:num(i.qty)||1, price:num(i.price)}));
    if(!clean.length){ toast('Add at least one item'); return; }
    const rec = {...o, customer:fd.get('customer').trim(), phone:fd.get('phone').trim(), items:clean,
      cake:{flavor:fd.get('flavor').trim(), weight:fd.get('weight').trim(), shape:fd.get('shape').trim(), message:fd.get('message').trim()},
      type:fd.get('type'), address:fd.get('address').trim(), deliveryDate:fd.get('deliveryDate'), deliveryTime:fd.get('deliveryTime'),
      discount:num(fd.get('discount')), deliveryCharge:num(fd.get('deliveryCharge')), notes:fd.get('notes').trim()};
    if(!isNew) rec.status = fd.get('status'); else rec.createdAt = new Date().toISOString();
    try{
      await put('orders', rec);
      try{ await upsertCustomer(rec.customer, rec.phone, fd.get('birthday')); }catch(e){}
      if(isNew){
        const adv = num(fd.get('advance'));
        if(adv>0) await put('txns', {id:uid(), type:'income', category:'Order Advance', amount:adv, method:fd.get('method'), date:today(), orderId:rec.id, note:'Advance · '+rec.no+' · '+rec.customer, createdAt:new Date().toISOString()});
        toast('Order saved ✓');
        if(S.config.autoConfirm!==false && waNumber(rec.phone)) setTimeout(()=>waModal(rec,'tplConfirm','Send order confirmation?'), 50);
        else closeModal();
      } else { toast('Order updated ✓'); closeModal(); }
    }catch(e){}
  };
}

/* ----- Bill ----- */
function billText(o){
  const c = S.config, L = '--------------------------------';
  let t = (c.shopName||'Sunrise Bakery').toUpperCase()+'\n'+(c.shopAddress?c.shopAddress+'\n':'')+(c.shopPhone?'Ph: '+c.shopPhone+'\n':'')+L+'\n';
  t += 'Bill No : '+o.no+'\nDate    : '+niceDate(today())+'\nCustomer: '+o.customer+(o.phone?' ('+o.phone+')':'')+'\n'+L+'\n';
  (o.items||[]).forEach(i=>{ t += i.name+'\n   '+i.qty+' x '+fmtN(i.price)+' = '+fmtN(num(i.qty)*num(i.price))+'\n'; });
  t += L+'\n';
  if(num(o.discount)) t += 'Discount        - '+fmtN(o.discount)+'\n';
  if(num(o.deliveryCharge)) t += 'Delivery        + '+fmtN(o.deliveryCharge)+'\n';
  t += 'TOTAL           '+fmt(orderTotal(o))+'\nPAID            '+fmt(orderPaid(o))+'\nBALANCE         '+fmt(orderBalance(o))+'\n'+L+'\n      Thank you! Visit again 🎂';
  return t;
}
function billModal(o){
  const t = billText(o);
  openModal('<h2>Bill · '+esc(o.no)+'</h2><div class="receipt">'+esc(t)+'</div><div class="ft"><button class="btn" data-close="1">Close</button><button class="btn" id="bCopy">Copy</button>'+(waNumber(o.phone)?'<a class="btn wa" target="_blank" rel="noopener" href="'+esc(waLink(o.phone,'```'+t+'```'))+'">'+I.wa+'Send bill</a>':'')+'</div>');
  $('#bCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText(t); toast('Bill copied'); }catch(e){ toast('Copy not allowed here'); } };
}

/* ============ Status change ============ */
async function setStatus(id, s){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  const rec = {...o, status:s}; if(s==='Ready') rec.readyAt = new Date().toISOString(); if(s==='Delivered') rec.deliveredAt = new Date().toISOString();
  try{ await put('orders', rec); }catch(e){ return; }
  if(s==='Ready'){
    toast('Marked ready 🎂');
    if(S.config.autoReady!==false) waModal(rec, 'tplReady', '🎂 Send “cake ready” message');
  } else if(s==='Delivered'){
    const bal = orderBalance(rec);
    if(bal>0){ collectModal(rec); toast('Delivered — collect the balance of '+fmt(bal)); }
    else toast('Delivered ✓');
  } else toast('Status: '+STATUS_LABEL[s]);
}

/* ============ Backup / restore / export ============ */
function backupJSON(){ return JSON.stringify({app:'sunrise-bakery', version:1, exportedAt:new Date().toISOString(), config:S.config, products:S.products, customers:S.customers, reminders:S.reminders, orders:S.orders, txns:S.txns}, null, 1); }
async function saveFile(name, data){
  const cap = window.Capacitor;
  if(cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Filesystem && cap.Plugins.Share){
    try{
      const r = await cap.Plugins.Filesystem.writeFile({path:name, data:String(data), directory:'CACHE', encoding:'utf8'});
      await cap.Plugins.Share.share({title:name, text:name, url:r.uri, dialogTitle:'Save or send file'});
      return true;
    }catch(e){ if(e && /cancel/i.test(String(e.message||e))) return false; toast('Could not save the file — use “Copy backup text” instead.'); return false; }
  }
  if(dl){ try{ await dl.save({filename:name, data}); return true; }catch(e){ if(e && e.code==='declined') return false; } }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return true; }catch(e){ toast('Download not available here — use “Copy” instead.'); return false; }
}
async function doRestore(mode){
  let txt = $('#restoreText').value.trim();
  const file = $('#restoreFile').files[0];
  if(file) txt = await file.text();
  if(!txt){ toast('Choose a backup file or paste backup text'); return; }
  let data; try{ data = JSON.parse(txt); }catch(e){ toast('That is not a valid backup file'); return; }
  if(data.app!=='sunrise-bakery'){ toast('That is not a Sunrise Bakery backup'); return; }
  const go = async () => {
    openModal('<h2>Restoring…</h2><p id="rProg">Please keep this page open.</p>');
    try{
      if(mode==='replace'){
        for(const k of ['orders','txns','products','customers','reminders']){ for(const r of [...S[k]]){ await del(k, r.id); } }
      }
      let n = 0; const total = (data.orders||[]).length+(data.txns||[]).length+(data.products||[]).length;
      for(const k of ['products','customers','orders','txns','reminders']){
        for(const r of (data[k]||[])){ if(r && r.id){ await put(k, {...r}); n++; if(n%10===0){ const p = $('#rProg'); if(p) p.textContent = 'Restored '+n+' of '+total+'…'; } } }
      }
      if(data.config) await putConfig(data.config);
      closeModal(); toast('Restore complete: '+n+' records ✓');
    }catch(e){ closeModal(); toast('Restore stopped — some records may not be restored.'); }
  };
  if(mode==='replace') confirmBox('This will <b>delete all current data</b> and replace it with the backup. Take a fresh backup first if unsure.', 'Replace everything', go);
  else go();
}
function csvEsc(v){ v = String(v??''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function reportSummary(){
  const [from,to] = repRange(); const tx = S.txns.filter(x=>x.date>=from&&x.date<=to);
  const ti = tx.filter(x=>x.type==='income').reduce((a,x)=>a+num(x.amount),0), te = tx.filter(x=>x.type==='expense').reduce((a,x)=>a+num(x.amount),0);
  const ords = S.orders.filter(o=>o.deliveryDate>=from&&o.deliveryDate<=to&&o.status!=='Cancelled');
  return '📊 '+(S.config.shopName)+' report\n'+niceDate(from)+' – '+niceDate(to)+'\n\nIncome: '+fmt(ti)+'\nExpense: '+fmt(te)+'\n'+(ti-te>=0?'Profit: ':'Loss: ')+fmt(ti-te)+'\nOrders: '+ords.length+' (value '+fmt(ords.reduce((a,o)=>a+orderTotal(o),0))+')';
}

/* ============ Events ============ */
document.addEventListener('click', async e => {
  const t = e.target;
  if(t.closest('[data-close]') && (t.dataset.close || t.closest('button[data-close]'))){ if(t.classList.contains('ov') || t.closest('button[data-close]')){ closeModal(); return; } }
  const g = t.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const ot = t.closest('[data-otab]'); if(ot){ S.orderTab = ot.dataset.otab; render(); return; }
  const tf = t.closest('[data-tfilter]'); if(tf){ S.txnFilter = tf.dataset.tfilter; render(); return; }
  const rg = t.closest('[data-range]'); if(rg){ S.rep.range = rg.dataset.range; render(); return; }
  const w = t.closest('[data-wa]'); if(w){ const o = S.orders.find(x=>x.id===w.dataset.id); if(!o) return; if(w.dataset.wa==='bill') billModal(o); else waModal(o, w.dataset.wa, {tplReady:'🎂 Cake ready message',tplConfirm:'🧾 Order confirmation',tplReminder:'💰 Payment reminder',tplThanks:'😊 Thank-you message'}[w.dataset.wa]); return; }
  const a = t.closest('[data-act]'); if(!a) return;
  const id = a.dataset.id, o = id ? S.orders.find(x=>x.id===id) : null;
  switch(a.dataset.act){
    case 'newOrder': orderForm(); break;
    case 'editOrder': if(o) orderForm(o); break;
    case 'setStatus': setStatus(id, a.dataset.s); break;
    case 'collect': if(o) collectModal(o); break;
    case 'waMenu': if(o) waMenu(o); break;
    case 'bill': if(o) billModal(o); break;
    case 'quickSale': txnForm(null,'income'); break;
    case 'newExpense': txnForm(null,'expense'); break;
    case 'editTxn': { const x = S.txns.find(x=>x.id===id); if(x) txnForm(x); break; }
    case 'newProduct': productForm(); break;
    case 'editProduct': { const p = S.products.find(p=>p.id===id); if(p) productForm(p); break; }
    case 'seedProducts': {
      const sample = [['Black Forest Cake','Cakes',900,'lb'],['White Forest Cake','Cakes',900,'lb'],['Red Velvet Cake','Cakes',1200,'lb'],['Chocolate Truffle Cake','Cakes',1100,'lb'],['Fresh Fruit Cake','Cakes',1000,'lb'],['Photo Cake','Cakes',1500,'lb'],['Pastry (assorted)','Pastries',120,'piece'],['Chocolate Brownie','Pastries',100,'piece'],['Doughnut','Pastries',80,'piece'],['Bread Loaf','Breads',90,'piece'],['Brown Bread','Breads',110,'piece'],['Butter Cookies','Cookies',350,'box'],['Chicken Patties','Snacks',90,'piece'],['Veg Puff','Snacks',60,'piece']];
      try{ for(const [n,c,p,u] of sample) await put('products',{id:uid(),name:n,category:c,price:p,unit:u}); toast('Sample menu added — edit prices to match yours'); }catch(e){}
      break; }
    case 'backup': { const ok = await saveFile('sunrise-bakery-backup-'+today()+'.json', backupJSON()); if(ok){ toast('Backup downloaded ✓'); try{ await putConfig({lastBackup:new Date().toISOString()}); }catch(e){} } break; }
    case 'copyBackup': try{ await navigator.clipboard.writeText(backupJSON()); toast('Backup copied — paste it into a note or email to yourself'); try{ await putConfig({lastBackup:new Date().toISOString()}); }catch(e){} }catch(err){ toast('Copy not allowed here — use Download'); } break;
    case 'restore': doRestore(a.dataset.mode); break;
    case 'exportCsv': {
      const [from,to] = repRange();
      const rows = [['Date','Type','Category','Amount','Method','Note','Order No']];
      S.txns.filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{ const ord = S.orders.find(o=>o.id===x.orderId); rows.push([x.date,x.type,x.category,x.amount,x.method,x.note,ord?ord.no:'']); });
      await saveFile('sunrise-bakery-transactions-'+from+'-to-'+to+'.csv', rows.map(r=>r.map(csvEsc).join(',')).join('\n'));
      break; }
    case 'copyReport': try{ await navigator.clipboard.writeText(reportSummary()); toast('Summary copied'); }catch(err){ toast('Copy not allowed here'); } break;
    case 'newCust': customerForm(); break;
    case 'editCust': { const c = (S.custCache||{})[a.dataset.k]; if(c) customerForm(c); break; }
    case 'sendRem': { const r = (S.remCache||{})[a.dataset.rid]; if(r) waModal(r.obj, r.tplKey, r.type==='bday'?'🎂 Birthday wish':'🔁 Order-again reminder', r.id); break; }
    case 'markSent': markSent(a.dataset.rid).then(()=>toast('Marked done ✓')); break;
    case 'enableNotif': { const LN = notifPlugin(); if(!LN){ toast('Notifications work in the Android app'); break; } try{ const r = await LN.requestPermissions(); if(r.display==='granted'){ toast('Notifications on ✓'); scheduleNotifs(); } else toast('Please allow notifications in phone settings'); }catch(err){ toast('Could not turn on notifications'); } break; }
    case 'saveCloud': {
      const txt = ($('#cloudCfg')||{}).value || ''; const cfg = {};
      for(const m of txt.matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g)) cfg[m[1]] = m[2];
      if(!cfg.apiKey || !cfg.projectId || !cfg.appId){ toast('That does not look like a firebaseConfig — copy the whole block from Firebase.'); break; }
      try{ localStorage.setItem('sb_firebase_cfg', JSON.stringify(cfg)); }catch(err){ toast('Could not save on this phone'); break; }
      toast('Saved — reconnecting…'); setTimeout(()=>location.reload(), 900); break; }
    case 'clearCloud': confirmBox('Disconnect cloud sync on this phone? Your cloud data stays safe online; this phone will use its own local data again.', 'Disconnect', async ()=>{ try{ localStorage.removeItem('sb_firebase_cfg'); }catch(err){} location.reload(); }); break;
    case 'uploadLocal': {
      let j = null; try{ j = JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(err){}
      if(!j || !((j.orders||[]).length||(j.txns||[]).length||(j.products||[]).length)){ toast('No older data on this phone to upload.'); break; }
      toast('Uploading…'); let n = 0;
      try{ for(const k of ['products','customers','orders','txns','reminders']){ for(const r of (j[k]||[])){ if(r && r.id){ await put(k, {...r}); n++; } } } toast('Uploaded '+n+' records to the cloud ✓'); }
      catch(err){ toast('Upload stopped — try again with internet.'); }
      break; }
    case 'resetTpl': confirmBox('Reset all WhatsApp templates to default?', 'Reset', async ()=>{ try{ await putConfig({tplReady:DEFAULT_CONFIG.tplReady,tplConfirm:DEFAULT_CONFIG.tplConfirm,tplThanks:DEFAULT_CONFIG.tplThanks,tplReminder:DEFAULT_CONFIG.tplReminder,tplBirthday:DEFAULT_CONFIG.tplBirthday,tplAnniv:DEFAULT_CONFIG.tplAnniv}); toast('Templates reset'); }catch(e){} }); break;
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='orderSearch'){ S.orderSearch = e.target.value; render(); }
  if(e.target.id==='txnSearch'){ S.txnSearch = e.target.value; render(); }
});
document.addEventListener('change', e => {
  if(e.target.id==='repFrom'){ S.rep.from = e.target.value; render(); }
  if(e.target.id==='repTo'){ S.rep.to = e.target.value; render(); }
});
document.addEventListener('submit', async e => {
  if(e.target.id==='setForm'){
    e.preventDefault(); const fd = new FormData(e.target);
    const cfg = {}; ['shopName','shopPhone','shopAddress','currency','tplReady','tplConfirm','tplReminder','tplThanks','tplBirthday','tplAnniv'].forEach(k=>cfg[k]=String(fd.get(k)||''));
    cfg.autoReady = !!fd.get('autoReady'); cfg.autoConfirm = !!fd.get('autoConfirm');
    try{ await putConfig(cfg); toast('Settings saved ✓'); }catch(err){}
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

/* Start */
{ const h = (location.hash||'').slice(1); if(VIEWS.some(v=>v[0]===h)) S.view = h; }
init();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
