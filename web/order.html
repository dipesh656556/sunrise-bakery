<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order cakes online – Sunrise Bakery</title>
<meta name="theme-color" content="#c2571a">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#c2571a;--brand2:#f39a2b;--choc:#3b2417;--ink:#2b1d14;--ink2:#6b5547;--muted:#9a8878;--line:#eadfd2;--bg:#fbf5ed;--card:#fff;--ok:#1f8a4c;--bad:#c53030}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
header{position:sticky;top:0;z-index:20;background:rgba(251,245,237,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.hd b{font-family:Fraunces,serif;font-size:20px;flex:1}
.cartbtn{border:0;background:var(--brand);color:#fff;font-weight:700;border-radius:99px;padding:10px 16px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;font-family:inherit}
.cartbtn i{background:#fff;color:var(--brand);border-radius:99px;padding:1px 8px;font-style:normal;font-size:12px}
.hero{background:linear-gradient(135deg,#3b2417,#7a3512 60%,#c2571a);color:#fff;padding:34px 16px 38px}
.hero .in{max-width:1100px;margin:auto}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.1}
.hero p{max-width:560px;opacity:.92;font-size:16px;line-height:1.5;margin:12px 0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);padding:7px 13px;border-radius:99px;font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:18px 16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.cat{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(80,40,10,.08);display:flex;flex-direction:column;transition:transform .2s}
.pc:hover{transform:translateY(-3px)}
.pc .im{position:relative}.pc img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f4e8da}
.sold{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bad);font-size:16px}
.pb{padding:14px 15px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pb h3{font-size:18px}.pb p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.45;flex:1}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sz{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:center;line-height:1.25}
.sz b{display:block}.sz.on{border-color:var(--brand);background:#fff3e8;color:var(--brand)}.sz.na{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.pr{display:flex;align-items:center;gap:10px}.pr b{font-size:19px;color:var(--brand);flex:1}
.add{border:0;background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:10px 16px;cursor:pointer;font-size:14px;font-family:inherit}
.add:disabled{background:#ccc;cursor:not-allowed}
.sheet{position:fixed;inset:0;background:rgba(43,29,20,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:22px}}
.panel h2{font-size:24px;margin-bottom:12px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line b{font-size:15px}.line .sub{color:var(--muted);font-size:12.5px}
.qty{display:flex;align-items:center;gap:8px;grid-row:span 2}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.line input.msg{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2);margin-top:12px}
input,textarea,select{border:1px solid #e1d3c4;border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;width:100%;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand2);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}.ex input{width:auto}.ex span{flex:1}
.tot{background:#faf3ea;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .g{font-size:18px;font-weight:700;color:var(--brand);border-top:1px dashed #e0cdb8;margin-top:6px;padding-top:8px}
.pay{background:#eef7ff;border:1px solid #cfe3f7;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.5}
.pay img{width:190px;max-width:60%;display:block;margin:10px auto 0;border-radius:12px;border:1px solid var(--line)}
.go{width:100%;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:16px;border-radius:14px;padding:15px;margin-top:16px;cursor:pointer;font-family:inherit}
.go:disabled{opacity:.6}
.ghost{width:100%;border:1px solid var(--line);background:#fff;font-weight:600;border-radius:14px;padding:13px;margin-top:10px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);text-decoration:none;display:block;text-align:center}
.wa{background:#25d366;border-color:#25d366;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:none}
.bar.on{display:block}.bar button{max-width:560px;margin:auto;display:flex;width:100%;justify-content:space-between}
.ok{text-align:center;padding:10px 0}.ok .big{font-size:56px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.closed{text-align:center;padding:60px 20px;color:var(--ink2)}
footer{max-width:1100px;margin:30px auto 0;padding:0 16px 30px;color:var(--muted);font-size:13px;text-align:center}
.hp{position:absolute;left:-9999px}
</style></head><body>
<header><div class="hd"><svg width="34" height="34" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#f39a2b"/><path d="M8 25a12 12 0 0 1 24 0z" fill="#fff6e8"/><g stroke="#fff6e8" stroke-width="2" stroke-linecap="round"><path d="M20 7v3M10.5 11l2 2M29.5 11l-2 2M6 18h3M31 18h3"/></g><rect x="7" y="25" width="26" height="2.4" rx="1.2" fill="#5a3420"/></svg><b id="shopName">Sunrise Bakery</b><button class="cartbtn" id="cartTop">🛒 Cart <i id="cnt">0</i></button></div></header>
<div class="hero"><div class="in"><h1 id="heroT">Fresh cakes,<br>baked for your moments</h1><p id="welcome"></p><div class="chips" id="chips"></div></div></div>
<div class="wrap"><div class="cats" id="cats"></div><div id="menu"><div class="closed">Loading our menu…</div></div></div>
<footer id="foot"></footer>
<div class="bar" id="bar"><button class="go" id="barBtn"><span id="barN">View cart</span><span id="barT"></span></button></div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script>
const $ = s=>document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let INFO=null, MENU=[], cart=[], cat='All', sel={}, db=null, placed=null;
const cur = () => (INFO&&INFO.currency)||'Rs.';
const money = n => cur()+' '+Math.round(+n||0).toLocaleString('en-IN');
const waNum = p => { let d=String(p||'').replace(/\D/g,''); if(d.length===10&&d[0]==='9') d='977'+d; else if(d.startsWith('0')) d='977'+d.slice(1); return d; };

function init(){
  if(!window.FIREBASE_CONFIG){ $('#menu').innerHTML='<div class="closed">Ordering is not set up yet.</div>'; return; }
  firebase.initializeApp(window.FIREBASE_CONFIG); db=firebase.firestore();
  db.doc('pubInfo/shop').onSnapshot(s=>{ INFO=s.exists?s.data():null; drawTop(); draw(); }, e=>{ $('#menu').innerHTML='<div class="closed">Could not load the menu. Please check your internet and refresh.</div>'; });
  db.collection('pubMenu').onSnapshot(s=>{ MENU=s.docs.map(d=>d.data()); draw(); }, ()=>{});
}
function drawTop(){
  if(!INFO) return;
  $('#shopName').textContent=INFO.shopName||'Sunrise Bakery'; document.title='Order cakes online – '+(INFO.shopName||'Sunrise Bakery');
  $('#welcome').textContent=INFO.welcome||'';
  $('#chips').innerHTML=[INFO.hours&&'🕒 '+INFO.hours, INFO.address&&'📍 '+INFO.address, '🛍️ Pickup from shop', INFO.minNoticeDays?'⏳ Order '+INFO.minNoticeDays+' day'+(INFO.minNoticeDays>1?'s':'')+' ahead':''].filter(Boolean).map(t=>'<span class="chip">'+esc(t)+'</span>').join('');
  $('#foot').innerHTML=esc(INFO.shopName||'')+(INFO.phone?' · 📞 '+esc(INFO.phone):'')+'<br>Powered by Sunrise Bakery Manager';
}
function draw(){
  const menuEl=$('#menu');
  if(!INFO){ menuEl.innerHTML='<div class="closed">Our online menu is being prepared. Please check back soon.</div>'; return; }
  if(INFO.enabled===false){ menuEl.innerHTML='<div class="closed"><h2>Online ordering is closed right now</h2><p>'+(INFO.phone?'Please call us on <b>'+esc(INFO.phone)+'</b>.':'Please visit our shop.')+'</p></div>'; $('#cats').innerHTML=''; return; }
  const cats=['All'].concat(INFO.categories||[]);
  $('#cats').innerHTML=cats.map(c=>'<button class="cat'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');
  const list=MENU.filter(m=>cat==='All'||m.category===cat).sort((a,b)=>(a.kind==='cake'?0:1)-(b.kind==='cake'?0:1)||a.name.localeCompare(b.name));
  menuEl.innerHTML='<div class="grid">'+list.map(m=>{
    const cake=m.kind==='cake'&&m.sizes&&m.sizes.length;
    let si=sel[m.id]; if(cake && (si==null || !m.sizes[si] || !m.sizes[si].ok)) si=m.sizes.findIndex(z=>z.ok); if(si<0) si=0; sel[m.id]=si;
    const price=cake?m.sizes[si].price:m.price, ok=cake?m.sizes[si].ok:m.ok;
    return '<div class="pc"><div class="im"><img loading="lazy" src="'+esc(m.photo)+'" alt="'+esc(m.name)+'">'+(!m.ok?'<div class="sold">Sold out today</div>':'')+'</div><div class="pb"><h3>'+esc(m.name)+'</h3><p>'+esc(m.desc)+'</p>'+
      (cake?'<div class="sizes">'+m.sizes.map((z,i)=>'<button class="sz'+(i===si?' on':'')+(z.ok?'':' na')+'" data-m="'+m.id+'" data-s="'+i+'"><b>'+esc(z.label)+'</b>'+money(z.price)+'</button>').join('')+'</div>':'')+
      '<div class="pr"><b>'+money(price)+(!cake&&m.unit&&m.unit!=='piece'?' <small style="font-weight:500;color:var(--muted)">/ '+esc(m.unit)+'</small>':'')+'</b><button class="add" data-add="'+m.id+'"'+(ok?'':' disabled')+'>'+(ok?'Add +':'Sold out')+'</button></div></div></div>';
  }).join('')+'</div>';
  drawBar();
}
const sub = () => cart.reduce((a,l)=>a+l.price*l.qty,0);
function drawBar(){ const n=cart.reduce((a,l)=>a+l.qty,0); $('#cnt').textContent=n; $('#bar').classList.toggle('on',n>0&&!$('#sheet').classList.contains('on')); $('#barN').textContent='🛒 View cart ('+n+')'; $('#barT').textContent=money(sub()); }
function addToCart(id){
  const m=MENU.find(x=>x.id===id); if(!m) return; const cake=m.kind==='cake'&&m.sizes&&m.sizes.length; const z=cake?m.sizes[sel[id]]:null;
  const key=id+'|'+(z?z.label:''); const ex=cart.find(l=>l.key===key);
  if(ex) ex.qty++; else cart.push({key,id,name:m.name,size:z?z.label:'',kg:z?z.kg:0,price:z?z.price:m.price,qty:1,msg:'',cake:!!cake});
  drawBar(); toast('Added to cart');
}
function toast(t){ let e=document.createElement('div'); e.textContent=t; e.style.cssText='position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#2b1d14;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:14px'; document.body.appendChild(e); setTimeout(()=>e.remove(),1200); }
function open_(html){ $('#panel').innerHTML=html; $('#sheet').classList.add('on'); $('#bar').classList.remove('on'); }
function close_(){ $('#sheet').classList.remove('on'); drawBar(); }
function minDate(){ const d=new Date(); d.setDate(d.getDate()+(+INFO.minNoticeDays||0)); return ymd(d); }
function extrasSel(){ return [...document.querySelectorAll('[name=ex]:checked')].map(e=>INFO.extras.find(x=>x.id===e.value)).filter(Boolean); }
function totals(){ const ex=extrasSel().reduce((a,x)=>a+x.price,0), t=sub()+ex, adv=Math.round(t*(+INFO.advancePercent||0)/100); return {t,adv,ex}; }
function cartView(){
  if(!cart.length){ open_('<h2>Your cart</h2><p style="color:var(--ink2)">Your cart is empty. Pick a cake you love!</p><button class="ghost" id="closeBtn">Browse menu</button>'); return; }
  let ls=JSON.parse(localStorage.getItem('sb_cust')||'{}');
  open_('<h2>Your order</h2>'+cart.map((l,i)=>'<div class="line"><div><b>'+esc(l.name)+'</b><div class="sub">'+(l.size?esc(l.size)+' · ':'')+money(l.price)+'</div></div><div class="qty"><button data-q="-1" data-i="'+i+'">−</button><b>'+l.qty+'</b><button data-q="1" data-i="'+i+'">+</button></div>'+(l.cake?'<input class="msg" data-m="'+i+'" placeholder="✍️ Message on cake (e.g. Happy Birthday Aarav)" maxlength="60" value="'+esc(l.msg)+'">':'')+'</div>').join('')+
    (INFO.extras&&INFO.extras.length?'<label class="f">Add extras</label>'+INFO.extras.map(x=>'<label class="ex"><input type="checkbox" name="ex" value="'+x.id+'"><span>'+esc(x.name)+'</span><b>+'+money(x.price)+'</b></label>').join(''):'')+
    '<div class="two"><label class="f">Your name *<input id="cName" value="'+esc(ls.name||'')+'" autocomplete="name"></label><label class="f">WhatsApp / phone *<input id="cPhone" inputmode="tel" value="'+esc(ls.phone||'')+'" placeholder="98XXXXXXXX" autocomplete="tel"></label>'+
    '<label class="f">Pickup date *<input type="date" id="cDate" min="'+minDate()+'" value="'+minDate()+'"></label><label class="f">Pickup time<input type="time" id="cTime" value="10:00"></label></div>'+
    '<label class="f">Notes (flavour, design, allergies…)<textarea id="cNotes" rows="2"></textarea></label><input class="hp" id="hp" tabindex="-1" autocomplete="off">'+
    '<div class="tot" id="tot"></div>'+
    '<div class="pay"><b>How to pay</b><br>'+esc(INFO.payNote||'Pay at the shop on pickup.')+(INFO.payBank?'<br><span style="white-space:pre-line">'+esc(INFO.payBank)+'</span>':'')+(INFO.payQr?'<img src="'+esc(INFO.payQr)+'" alt="Payment QR">':'')+'</div>'+
    '<div class="err" id="err"></div><button class="go" id="place">Place order</button><button class="ghost" id="closeBtn">Keep shopping</button>');
  totDraw();
}
function totDraw(){ const {t,adv,ex}=totals(); $('#tot').innerHTML='<div><span>Items</span><span>'+money(sub())+'</span></div>'+(ex?'<div><span>Extras</span><span>'+money(ex)+'</span></div>':'')+'<div class="g"><span>Total</span><span>'+money(t)+'</span></div>'+(adv?'<div><span>Advance to pay ('+INFO.advancePercent+'%)</span><b>'+money(adv)+'</b></div>':''); }
async function place(){
  const err=$('#err'); err.textContent='';
  const name=$('#cName').value.trim(), phone=$('#cPhone').value.trim(), date=$('#cDate').value, time=$('#cTime').value;
  if($('#hp').value) return;
  if(!name){ err.textContent='Please enter your name.'; return; }
  if(waNum(phone).length<10){ err.textContent='Please enter a valid phone number.'; return; }
  if(!date || date<minDate()){ err.textContent='Please choose a pickup date on or after '+minDate()+'.'; return; }
  const last=+localStorage.getItem('sb_last')||0; if(Date.now()-last<45000){ err.textContent='Please wait a minute before placing another order.'; return; }
  const ex=extrasSel(), {t,adv}=totals();
  const items=cart.map(l=>({name:l.name+(l.size?' ('+l.size+')':''),qty:l.qty,price:l.price,menuId:l.id,...(l.kg?{kg:l.kg}:{})})).concat(ex.map(x=>({name:'Extra: '+x.name,qty:1,price:x.price,extraId:x.id})));
  const msgs=cart.filter(l=>l.msg.trim()).map(l=>l.name+(l.size?' '+l.size:'')+': “'+l.msg.trim()+'”');
  const d=new Date(), id=Date.now().toString(36)+Math.random().toString(36).slice(2,8), no='WEB'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
  const order={id,no,customer:name,phone,items,cake:{flavor:cart.filter(l=>l.cake).map(l=>l.name).join(', '),weight:cart.filter(l=>l.cake).map(l=>l.size).join(', '),shape:'',message:cart.filter(l=>l.msg.trim()).map(l=>l.msg.trim()).join(' / ')},
    deliveryDate:date,deliveryTime:time||'',type:'Pickup',address:'',discount:0,deliveryCharge:0,status:'New',source:'online',createdAt:new Date().toISOString(),
    notes:(msgs.length?'Cake messages — '+msgs.join('; ')+'. ':'')+$('#cNotes').value.trim().slice(0,300)};
  const btn=$('#place'); btn.disabled=true; btn.textContent='Sending…';
  try{
    await Promise.race([db.collection('orders').doc(id).set(order), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);
    localStorage.setItem('sb_last',Date.now()); localStorage.setItem('sb_cust',JSON.stringify({name,phone}));
    placed={order,t,adv}; cart=[]; success();
  }catch(e){ btn.disabled=false; btn.textContent='Place order'; err.textContent='Could not send your order. Please check your internet and try again'+(INFO.phone?' or call '+INFO.phone:'')+'.'; }
}
function success(){
  const {order,t,adv}=placed; const shop=waNum(INFO.phone);
  const text='Hello '+(INFO.shopName||'')+'! I placed online order '+order.no+' ('+order.items.map(i=>i.qty+' x '+i.name).join(', ')+') for '+order.deliveryDate+'. Total '+money(t)+'.'+(adv?' Sending advance '+money(adv)+' – screenshot attached.':'');
  open_('<div class="ok"><div class="big">🎉</div><h2>Order received!</h2><p style="color:var(--ink2)">Thank you, <b>'+esc(order.customer)+'</b>. Your order number is<br><b style="font-size:20px;color:var(--brand)">'+esc(order.no)+'</b></p></div>'+
    '<div class="tot"><div><span>Pickup</span><b>'+esc(order.deliveryDate)+' '+esc(order.deliveryTime)+'</b></div><div class="g"><span>Total</span><span>'+money(t)+'</span></div>'+(adv?'<div><span>Advance to pay</span><b>'+money(adv)+'</b></div>':'')+'</div>'+
    '<div class="pay"><b>Next step: confirm with advance</b><br>'+esc(INFO.payNote||'')+(INFO.payQr?'<img src="'+esc(INFO.payQr)+'" alt="Payment QR">':'')+'</div>'+
    (shop?'<a class="ghost wa" target="_blank" rel="noopener" href="https://wa.me/'+shop+'?text='+encodeURIComponent(text)+'">Send payment screenshot on WhatsApp</a>':'')+
    '<p style="color:var(--muted);font-size:13px;text-align:center">We will confirm your order on WhatsApp shortly.</p><button class="ghost" id="closeBtn">Done</button>');
}
document.addEventListener('click',e=>{
  const t=e.target;
  const c=t.closest('[data-c]'); if(c){ cat=c.dataset.c; draw(); return; }
  const sz=t.closest('[data-s]'); if(sz){ if(sz.classList.contains('na')) return; sel[sz.dataset.m]=+sz.dataset.s; draw(); return; }
  const ad=t.closest('[data-add]'); if(ad){ addToCart(ad.dataset.add); return; }
  const q=t.closest('[data-q]'); if(q){ const l=cart[+q.dataset.i]; l.qty+= +q.dataset.q; if(l.qty<1) cart.splice(+q.dataset.i,1); cartView(); return; }
  if(t.id==='cartTop'||t.closest('#barBtn')){ cartView(); return; }
  if(t.id==='place'){ place(); return; }
  if(t.id==='closeBtn'||t.id==='sheet'){ close_(); return; }
});
document.addEventListener('input',e=>{ if(e.target.dataset.m!==undefined && e.target.classList.contains('msg')) cart[+e.target.dataset.m].msg=e.target.value; });
document.addEventListener('change',e=>{ if(e.target.name==='ex') totDraw(); });
init();
</script></body></html>
